name: Build world food packs

# Weekly: stream Open Food Facts' raw database dump (the only source), check it
# against their published SHA-256, build one pack per country, then sign and
# publish them in a separate job. The build job has no secrets and is the only
# one that touches downloaded data; the sign job has the key and never does.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-packs
  cancel-in-progress: false

env:
  OFF_DUMP_URL: https://static.openfoodfacts.org/data/openfoodfacts-mongodbdump.gz
  OFF_DUMP_SHA_URL: https://static.openfoodfacts.org/data/gz-sha256sum
  USER_AGENT: world-food-packs (https://github.com/${{ github.repository }})
  KEEP_RELEASES: 4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Get the dump's published SHA-256
        run: |
          SHA=$(curl --fail --silent --show-error --location --retry 3 --user-agent "$USER_AGENT" "$OFF_DUMP_SHA_URL" \
                | awk '$2 == "openfoodfacts-mongodbdump.gz" {print $1}')
          if ! [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]; then echo "No usable SHA-256 published for the dump"; exit 1; fi
          echo "DUMP_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Stream the dump into the slim file
        # Read as it downloads and never stored. extract_dump.py hashes every byte
        # and deletes its output if the hash doesn't match.
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 30 --user-agent "$USER_AGENT" "$OFF_DUMP_URL" \
            | python -I scripts/extract_dump.py - --sha256 "$DUMP_SHA" --out "$RUNNER_TEMP/slim.jsonl"

      - name: Build country packs
        run: python -I scripts/build_packs.py --slim "$RUNNER_TEMP/slim.jsonl" --source-sha256 "$DUMP_SHA" --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-packs
          path: dist/
          retention-days: 2
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create releases
      actions: write  # keep the schedule from being switched off after 60 quiet days
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-packs
          path: dist

      - name: Last week's index and the live UK count
        run: |
          curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/index.json" -o previous-index.json || rm -f previous-index.json
          LIVE=$(curl -sf --retry 3 --retry-delay 20 --user-agent "$USER_AGENT" \
                  "https://world.openfoodfacts.org/api/v2/search?countries_tags=en:united-kingdom&fields=code&page_size=1" \
                  | jq -r '.count // empty' || true)
          echo "live UK count: ${LIVE:-unavailable}"
          echo "LIVE_UK=${LIVE}" >> "$GITHUB_ENV"

      - name: Check and sign
        env:
          SIGNING_KEY: ${{ secrets.FOOD_PACK_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          python3 -I scripts/sign_packs.py --dist dist --key "$RUNNER_TEMP/key.pem" \
            --previous previous-index.json ${LIVE_UK:+--live-count "$LIVE_UK"} --min-uk 150000
          rm -f "$RUNNER_TEMP/key.pem"
          # Prove every signature checks out against the public key the app ships with.
          for f in index.json $(jq -r '.packs[].file' dist/index.json); do
            if [ "$f" = index.json ]; then sig=$(cat dist/index.json.sig); else sig=$(jq -r --arg f "$f" '.packs[] | select(.file == $f) | .signature' dist/index.json); fi
            openssl pkeyutl -verify -pubin -inkey keys/food-pack-public.pem -rawin -in "dist/$f" -sigfile <(echo "$sig" | base64 -d)
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version dist/index.json)
          COUNT=$(jq -r '.packs | length' dist/index.json)
          TAG="packs-${VERSION}"
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --title "World food packs ${VERSION}" \
            --notes "${COUNT} country packs from the Open Food Facts database dump (SHA-256 $(jq -r .source_sha256 dist/index.json)), available under the ODbL 1.0." \
            --latest

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("packs-"))] | sort_by(.createdAt) | reverse | .[(env.KEEP_RELEASES | tonumber):] | .[].tagName' \
          | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done

      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/enable"
